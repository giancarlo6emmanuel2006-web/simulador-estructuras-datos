<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pila de Panqueques</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
 * {
    margin: 0px;
    padding: 0px;
}
body {
    text-align: center;
    font-family: Arial;
    background-color: #f2f2f2;
}

h1 {
    margin-top: 20px;
}

/* El contenedor de la pila */
#pila-visual {
    margin: 0 auto;
    width: 200px;
    min-height: 300px;
    display: flex;
    flex-direction: column-reverse; /* El último en entrar queda arriba visualmente */
    align-items: center;
    padding: 0;

}

.panqueque-img {
    width: 150px;
    margin-top: -50px; /* Encima uno sobre otro */
}

button {
    padding: 10px 15px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

#mensaje {
    font-weight: bold;
    margin-top: 15px;
}

#header {
    width: 100%;
    padding: 10px;
    background: #194775;
}
</style>
</head>

<body>
    <header>
        <div id="header">
            <a href="index.html">
                <img style="max-width: 100px;" src="img/logo.png">
             </a>
        </div>    
    </header>

<h1> Pila de Panqueques (Estructura LIFO)</h1>

<button onclick="agregarPanqueque()">Agregar Panqueque</button>
<button onclick="quitarPanqueque()">Quitar Panqueque</button>

<div id="pila-visual"></div>

<div id="mesa" style="
    display: block;
    width: 100%;
    height: 100px;
    background-image: url(img/mesa2.png);
    background-repeat: no-repeat;
    background-position: bottom;
    margin-top: -20px;
"></div>

<div id="mensaje"></div>

<script>

let miPila = []; 
const limiteMaximo = 20;

function agregarPanqueque() {
    if (miPila.length >= limiteMaximo) {
        mostrarMensaje(" Demasiados panqueques, se pueden caer.");
        return;
    }

    // .push agrega al final de la lista (arriba de la pila)
    miPila.push("panqueque"); 
    dibujarPila();
    mostrarMensaje(" Panqueque agregado.");
}

function quitarPanqueque() {
    if (miPila.length === 0) {
        mostrarMensaje(" La pila está vacía.");
        return;
    }

    // .pop elimina el último elemento (el que está arriba)
    miPila.pop(); 
    dibujarPila();
    mostrarMensaje(" Panqueque retirado.");
}

function dibujarPila() {
    const contenedor = document.getElementById("pila-visual");
    contenedor.innerHTML = ""; // Limpiamos para redibujar

    miPila.forEach((item, indice) => {
        const imagen = document.createElement("img");
        imagen.src = "img/panqueque.png";
        imagen.className = "panqueque-img";

        // Mantenemos la lógica de capas para que el nuevo tape al anterior
        imagen.style.position = "relative";
        imagen.style.zIndex = indice + 1; 

        contenedor.appendChild(imagen);
    });
}

function mostrarMensaje(texto) {
    document.getElementById("mensaje").textContent = texto;
}
</script>

</body>
</html>
