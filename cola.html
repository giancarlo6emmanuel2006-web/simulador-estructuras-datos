<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cola (Fila de Personas)</title>

<style>
    * {
    margin: 0px;
    padding: 0px;
}

body {
    text-align: center;
    font-family: Arial;
    background-color: #f2f2f2;
}

h1 {
    margin-top: 20px;
}

/* El contenedor donde se ven las personas */
#fila-visual {
    margin: 40px auto;
    width: 900px;
    min-height: 120px;
    display: flex;
    align-items: center;
    padding: 15px;
    gap: 10px;
    background-color: white;
    justify-content: flex-start;
}

.persona {
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    transition: transform 0.2s;
}

.persona img {
    width: 60px;
    height: 60px;
    object-fit: contain;
}

/* Resalta a la primera persona que será atendida */
.persona:first-child {
    background-color: lightgreen;
}

button {
    padding: 10px 15px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

#mensaje {
    width: 100%!important;
    display:block;
    font-weight: bold;
    margin-top: 15px;
    overflow: hidden;
}

#contenedor-cola {
    width: 80%;
    margin: 0 auto;
}

.mostrador {
    width: 18%;
    float: left;
}

#fila-visual {
    width: 75%!important;
    float: right;
}

#header {
    width: 100%;
    padding: 10px;
    background: #194775;
}
</style>
</head>

<body>
    <header>
        <div id="header">
            <a href="index.html">
                <img style="max-width: 100px;" src="img/logo.png">
             </a>
        </div>    
    </header>    

<h1> Cola (Estructura FIFO - Primero en entrar, primero en salir)</h1>

<button onclick="llegarPersona()">Agregar Persona</button>

<div id="contenedor-cola">
    <div class="mostrador">
            <img style="width: 100%" src="img/mostrador.png">
            <button onclick="atenderPersona()">Atender Persona</button>
    </div>
    <div id="fila-visual"></div>
    <div><div id="mensaje"></div></div>
</div>



<script>
// Lista que guarda la fila de personas
let fila = [];
const limitePersonas = 10;

// Lista de rutas de las imágenes disponibles
const imagenesPersonas = [
    "img/persona1.png",
    "img/persona2.png",
    "img/persona3.png",
    "img/persona4.png",
    "img/persona5.png",
    "img/persona6.png",
    "img/persona7.png",
    "img/persona8.png",
    "img/persona9.png",
    "img/persona10.png"
];

function llegarPersona() {
    if (fila.length >= limitePersonas) {
        mostrarMensaje("La fila esta llena (maximo 10 personas).");
        return;
    }

    // Elegir una imagen al azar para la nueva persona
    const imagenAzar = imagenesPersonas[Math.floor(Math.random() * imagenesPersonas.length)];
    
    // agrega al final de la fila
    fila.push(imagenAzar); 
    actualizarVista();
    mostrarMensaje("Persona agregada a la fila.");
}

function atenderPersona() {
    if (fila.length === 0) {
        mostrarMensaje("La cola esta vacia.");
        return;
    }

    // .shift quita al primero de la fila (el que mas tiempo lleva esperando)
    fila.shift(); 
    actualizarVista();
    mostrarMensaje("Persona atendida.");
}

function actualizarVista() {
    const contenedorFila = document.getElementById("fila-visual");
    contenedorFila.innerHTML = "";

    fila.forEach((rutaImagen) => {
        const divPersona = document.createElement("div");
        divPersona.className = "persona";

        const img = document.createElement("img");
        img.src = rutaImagen;

        divPersona.appendChild(img);
        contenedorFila.appendChild(divPersona);
    });
}

function mostrarMensaje(texto) {
    document.getElementById("mensaje").textContent = texto;
}
</script>

</body>
</html>
